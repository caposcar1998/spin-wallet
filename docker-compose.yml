services:
  wiremock:
    image: wiremock/wiremock:3.13.0
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      USERS_API_BASE_URL: http://localhost:3000/api
      MOCK_API_URL: http://wiremock:8080
    depends_on:
      - wiremock
